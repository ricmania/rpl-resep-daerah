{% extends "base.html" %}

{% block title %}Masuk — Pengelolaan Resep{% endblock %}

{% block content %}
  <h1>Masuk</h1>
  <p>Masuk untuk mengakses pengelolaan resep.</p>
  {% if error %}
    <p class="error" role="alert">{{ error }}</p>
  {% endif %}
  <form method="post" action="{{ url_for('login_submit') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if next_url %}
      <input type="hidden" name="next" value="{{ next_url }}">
    {% endif %}
    <label for="username">Nama pengguna</label>
    <input id="username" name="username" type="text" value="{{ username or '' }}" minlength="3" maxlength="32" pattern="[A-Za-z0-9._-]+" required autocomplete="username">

    <label for="password">Kata sandi</label>
    <input id="password" name="password" type="password" maxlength="128" required autocomplete="current-password">

    <div class="actions">
      <button class="button primary" type="submit">Masuk</button>
    </div>
  </form>
{% endblock %}
