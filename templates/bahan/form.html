{% extends "base.html" %}

{% block title %}{{ page_title }} — Pengelolaan Resep{% endblock %}

{% block content %}
  <h1>{{ page_title }}</h1>
  {% if error %}
    <p class="error" role="alert">{{ error }}</p>
  {% endif %}
  <form method="post" action="{{ form_action }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="nama">Nama bahan</label>
    <input
      id="nama"
      name="nama"
      type="text"
      value="{{ nama }}"
      required
      autofocus
      aria-describedby="nama-bantuan"
    >
    <p id="nama-bantuan" class="muted">Nama tidak boleh kosong. Nama yang sama diperbolehkan.</p>
    <div class="actions">
      <button class="button primary" type="submit">Simpan</button>
      <a class="button" href="{{ url_for('bahan_list') }}">Batal</a>
    </div>
  </form>
{% endblock %}
